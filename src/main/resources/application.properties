spring.application.name=springboot.routeros.connection
server.port=8081

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db_springboot_routeros?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Aktifkan DevTools
spring.devtools.restart.enabled=true

# Aktifkan LiveReload (untuk frontend/static files)
spring.devtools.livereload.enabled=true

# Opsional: tambahkan folder yang dipantau
spring.devtools.restart.additional-paths=src/main/java